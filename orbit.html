<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ORBIT · 宇宙漫游</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#02040a; }
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color:#cfe3f5; }
  #canvas { position:fixed; inset:0; display:block; }

  .panel {
    background: rgba(8,16,32,0.55);
    border: 1px solid rgba(110,180,220,0.25);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #ui.hidden > * { display:none; }
  #ui > * { pointer-events:auto; }

  /* 左上角 LOGO */
  #logo { position:absolute; top:16px; left:16px; padding:10px 16px; }
  #logo .t1 { font-size:20px; font-weight:700; letter-spacing:4px; color:#e8f4ff; }
  #logo .t2 { font-size:12px; letter-spacing:6px; color:#7fd8c8; margin-top:2px; }

  /* 顶部中间尺度按钮 */
  #scales { position:absolute; top:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; padding:6px; }
  #scales button {
    background:transparent; border:none; color:#9fc3e0; font-size:13px;
    padding:8px 16px; border-radius:8px; cursor:pointer; letter-spacing:2px; transition:all .2s;
  }
  #scales button:hover { color:#e8f4ff; background:rgba(110,180,220,0.12); }
  #scales button.active { color:#0a1828; background:#7fd8c8; font-weight:600; }

  /* 左侧信息面板 */
  #info { position:absolute; left:16px; top:50%; transform:translateY(-50%); width:230px; padding:16px; }
  #info .cn { font-size:20px; font-weight:700; color:#e8f4ff; }
  #info .en { font-size:12px; color:#7fd8c8; letter-spacing:3px; margin:2px 0 10px; }
  #info .row { display:flex; justify-content:space-between; font-size:12px; margin:5px 0; color:#9fc3e0; }
  #info .row b { color:#d8ecff; font-weight:500; text-align:right; max-width:130px; }
  #info .desc { font-size:12px; line-height:1.7; color:#8fb3cf; margin-top:10px; border-top:1px solid rgba(110,180,220,0.2); padding-top:10px; }

  /* 底部天体按钮栏 */
  #bodies { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:6px; padding:6px; flex-wrap:wrap; justify-content:center; max-width:92vw; }
  #bodies button {
    background:transparent; border:1px solid rgba(110,180,220,0.2); color:#9fc3e0;
    font-size:12px; padding:7px 12px; border-radius:8px; cursor:pointer; transition:all .2s;
  }
  #bodies button:hover { color:#e8f4ff; border-color:#7fd8c8; background:rgba(127,216,200,0.1); }

  /* 底部右侧控制 */
  #controls { position:absolute; bottom:16px; right:16px; display:flex; gap:6px; padding:6px; }
  #controls button {
    background:transparent; border:1px solid rgba(110,180,220,0.2); color:#9fc3e0;
    font-size:12px; padding:7px 12px; border-radius:8px; cursor:pointer; transition:all .2s; white-space:nowrap;
  }
  #controls button:hover { color:#e8f4ff; border-color:#7fd8c8; }
  #controls button.active { color:#7fd8c8; border-color:#7fd8c8; background:rgba(127,216,200,0.12); }

  /* 左下角比例说明 */
  #note { position:absolute; bottom:16px; left:16px; font-size:11px; color:#5f7f9d; letter-spacing:1px; }

  #hint { position:absolute; bottom:56px; right:16px; font-size:11px; color:#5f7f9d; text-align:right; line-height:1.8; }

  @media (max-width: 720px) {
    #info { display:none; }
    #hint { display:none; }
    #scales button { padding:6px 10px; font-size:12px; }
    #bodies button { padding:6px 9px; font-size:11px; }
    #controls button { padding:6px 9px; font-size:11px; }
    #controls { bottom:64px; }
    #note { bottom:64px; }
  }
  #boot {
    position:fixed; inset:0; z-index:99; display:flex; flex-direction:column; gap:12px;
    align-items:center; justify-content:center; background:#02040a; color:#8fb3cf;
    font-size:14px; letter-spacing:2px; text-align:center; padding:0 20px;
  }
  #boot .spin { width:34px; height:34px; border-radius:50%; border:2px solid rgba(127,216,200,0.2); border-top-color:#7fd8c8; animation:bspin 1s linear infinite; }
  @keyframes bspin { to { transform:rotate(360deg); } }
  #boot .err { color:#ff9c8a; font-size:12px; max-width:640px; word-break:break-all; text-align:left; white-space:pre-wrap; display:none; }
  #diag {
    position:fixed; left:0; right:0; bottom:0; z-index:999; max-height:45vh; overflow:auto;
    background:rgba(60,8,8,0.92); color:#ffb3a3; font:12px/1.6 ui-monospace, Consolas, monospace;
    padding:10px 14px; white-space:pre-wrap; display:none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="boot">
  <div class="spin"></div>
  <div id="boot-msg">正在加载 Three.js 与行星纹理 · 首次打开约需数秒</div>
  <div class="err" id="boot-err"></div>
</div>

<div id="diag"></div>

<div id="ui">
  <div id="logo" class="panel">
    <div class="t1">ORBIT</div>
    <div class="t2">宇宙漫游</div>
  </div>

  <div id="scales" class="panel">
    <button data-scale="earth" class="active">近地轨道</button>
    <button data-scale="solar">太阳系</button>
    <button data-scale="galaxy">银河系</button>
  </div>

  <div id="info" class="panel">
    <div class="cn" id="i-cn">地球</div>
    <div class="en" id="i-en">EARTH</div>
    <div class="row"><span>类型</span><b id="i-type">岩质行星</b></div>
    <div class="row"><span>直径</span><b id="i-dia">12,742 km</b></div>
    <div class="row"><span>公转周期</span><b id="i-per">365.25 天</b></div>
    <div class="desc" id="i-desc">目前已知唯一存在生命的行星，表面 71% 被海洋覆盖。</div>
  </div>

  <div id="bodies" class="panel"></div>

  <div id="controls" class="panel">
    <button id="btn-orbit" class="active">轨道线</button>
    <button id="btn-pause">暂停</button>
    <button data-speed="0.25">0.25×</button>
    <button data-speed="1" class="active">1×</button>
    <button data-speed="5">5×</button>
    <button data-speed="20">20×</button>
  </div>

  <div id="note">为可视化演示，非真实天文比例</div>
  <div id="hint">空格 暂停 · H 回地球 · F 全屏 · I 隐藏界面 · +/- 缩放<br>拖动旋转 · 滚轮缩放 · 点击天体飞行</div>
</div>

<script>
  // 全局错误兜底：任何加载/运行错误直接显示在页面底部
  window.__diag = function(msg){
    const box = document.getElementById('diag');
    if (!box) return;
    box.style.display = 'block';
    box.textContent += msg + '\n';
  };
  window.addEventListener('error', e => window.__diag('[错误] ' + (e.message || e.type)));
  window.addEventListener('unhandledrejection', e => window.__diag('[Promise] ' + ((e.reason && e.reason.message) || String(e.reason))));
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 模块加载成功：隐藏启动浮层
const bootEl = document.getElementById('boot');
if (bootEl) bootEl.style.display = 'none';

/* ================= 基础 ================= */
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, logarithmicDepthBuffer:true });
renderer.debug.onShaderError = (gl, program, vs, fs) => {
  const log = gl.getProgramInfoLog(program) || '';
  const vlog = gl.getShaderInfoLog(vs) || '';
  const flog = gl.getShaderInfoLog(fs) || '';
  window.__diag('[Shader] ' + (log + vlog + flog).slice(0, 1200));
};
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.05, 60000);
camera.position.set(0, 6, 16);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.5;
controls.maxDistance = 5000;

const texLoader = new THREE.TextureLoader();
texLoader.crossOrigin = 'anonymous';
function loadTex(url, onLoadColor) {
  const tex = texLoader.load(url, undefined, undefined, () => {});
  return tex;
}
const T = {
  earthDay:  'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
  earthNight:'https://threejs.org/examples/textures/planets/earth_lights_2048.png',
  earthCloud:'https://threejs.org/examples/textures/planets/earth_clouds_1024.png',
  moon:      'https://threejs.org/examples/textures/planets/moon_1024.jpg',
  sun:       'https://www.solarsystemscope.com/textures/download/2k_sun.jpg',
  mercury:   'https://www.solarsystemscope.com/textures/download/2k_mercury.jpg',
  venus:     'https://www.solarsystemscope.com/textures/download/2k_venus_surface.jpg',
  mars:      'https://www.solarsystemscope.com/textures/download/2k_mars.jpg',
  jupiter:   'https://www.solarsystemscope.com/textures/download/2k_jupiter.jpg',
  saturn:    'https://www.solarsystemscope.com/textures/download/2k_saturn.jpg',
  saturnRing:'https://www.solarsystemscope.com/textures/download/2k_saturn_ring_alpha.png',
  uranus:    'https://www.solarsystemscope.com/textures/download/2k_uranus.jpg',
  neptune:   'https://www.solarsystemscope.com/textures/download/2k_neptune.jpg'
};

/* ================= 程序化星球纹理（不依赖网络，保证每颗星球都有正确颜色与球面细节）================= */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const mix = (a, b, t) => a + (b - a) * t;
function hash2(x, y, seed){
  const n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453;
  return n - Math.floor(n);
}
function vnoise(x, y, seed){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash2(xi,yi,seed), b = hash2(xi+1,yi,seed), c = hash2(xi,yi+1,seed), d = hash2(xi+1,yi+1,seed);
  return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
}
function fbm(x, y, seed, oct){
  let s = 0, amp = 0.5, f = 1;
  for (let i=0;i<(oct||4);i++){ s += amp*vnoise(x*f, y*f, seed + i*17); f *= 2; amp *= 0.5; }
  return s;
}
const C3 = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];

function surfaceTexture(kind, seed){
  const W = kind.startsWith('earth') ? 1024 : 768, H = W/2;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H), d = img.data;

  // 配色
  const pal = {
    mercury: [C3('#5c534b'), C3('#8f867c'), C3('#b3aaa0')],
    venus:   [C3('#9c7a3f'), C3('#d9b26a'), C3('#f0dcae')],
    mars:    [C3('#6e2f1c'), C3('#b5502f'), C3('#dc8352')],
    jupiter: [C3('#6f4a2f'), C3('#c49a6c'), C3('#efe4cd')],
    saturn:  [C3('#a78d5c'), C3('#dcc596'), C3('#f2e7c8')],
    uranus:  [C3('#79b8c4'), C3('#a8d8de'), C3('#cdeef2')],
    neptune: [C3('#1f3fa8'), C3('#3b5fe0'), C3('#7fa0f5')],
    moon:    [C3('#4f4c48'), C3('#8f8c85'), C3('#c3c0b8')],
    sun:     [C3('#ff8a12'), C3('#ffb733'), C3('#fff0b0')],
    earthDay:[C3('#12325e'), C3('#2a6fb0'), C3('#2f7a3e')],
    earthNight:[C3('#000000'), C3('#0a0a12'), C3('#000000')]
  }[kind] || [C3('#666666'), C3('#999999'), C3('#cccccc')];

  for (let y=0; y<H; y++){
    const v = y/H;                       // 0 北极 → 1 南极
    const lat = (v - 0.5) * Math.PI;     // -π/2 → π/2
    for (let x=0; x<W; x++){
      const u = x/W;
      const th = u * Math.PI * 2;
      const nx = Math.cos(th), nz = Math.sin(th);
      let r, g, b;

      if (kind === 'jupiter' || kind === 'saturn' || kind === 'uranus' || kind === 'neptune'){
        // 气态行星：水平条带 + 湍流
        const bands = kind === 'jupiter' ? 11 : kind === 'saturn' ? 9 : 5;
        const turb = (fbm(nx*2.2, nz*2.2 + v*6, seed, 4) - 0.5) * (kind === 'jupiter' ? 0.16 : 0.07);
        const stripe = Math.sin((v + turb) * Math.PI * bands);
        const fine = (fbm(nx*3, nz*3 + v*26, seed+9, 3) - 0.5) * 0.12;
        let t = clamp01(0.5 + 0.5*stripe + fine);
        if (kind === 'uranus') t = 0.5 + (t-0.5)*0.35;   // 天王星近乎均匀
        if (kind === 'neptune') t = 0.45 + (t-0.45)*0.8;
        const a = pal[0], bb = pal[1], cc = pal[2];
        if (t < 0.5){ const k = t/0.5; r = mix(a[0],bb[0],k); g = mix(a[1],bb[1],k); b = mix(a[2],bb[2],k); }
        else { const k = (t-0.5)/0.5; r = mix(bb[0],cc[0],k); g = mix(bb[1],cc[1],k); b = mix(bb[2],cc[2],k); }
      } else if (kind === 'earthDay'){
        // 海陆分布
        const n = fbm(nx*1.9 + 5, nz*1.9 + v*5, seed, 5);
        const land = n > 0.52;
        const ice = Math.abs(lat) > 1.18;
        const shade = 0.8 + fbm(nx*8, nz*8 + v*8, seed+3, 3)*0.5;
        if (ice){ r = 232; g = 240; b = 250; }
        else if (land){
          const dry = clamp01((fbm(nx*3.4, nz*3.4 + v*3.4, seed+7, 4) - 0.45) * 3.2);
          const h = clamp01((n - 0.52) * 4);
          r = mix(58, 168, dry) * shade; g = mix(110, 140, dry) * shade; b = mix(56, 92, dry) * shade;
          if (h > 0.55){ r = mix(r, 120, 0.4); g = mix(g, 96, 0.4); b = mix(b, 78, 0.4); } // 高原
        } else {
          const deep = clamp01((0.52 - n) * 3.0);
          r = mix(56, 20, deep); g = mix(122, 64, deep); b = mix(196, 128, deep);
        }
      } else if (kind === 'earthNight'){
        const n = fbm(nx*1.9 + 5, nz*1.9 + v*5, seed, 5);
        const land = n > 0.52 && Math.abs(lat) < 1.15;
        const city = land ? Math.pow(clamp01(fbm(nx*16, nz*16 + v*16, seed+21, 3) - 0.55) * 3.2, 1.6) : 0;
        r = 255*city; g = 216*city*0.92; b = 150*city*0.7;
      } else if (kind === 'sun'){
        const gran = fbm(nx*7, nz*7 + v*7, seed, 4);
        const t = clamp01(gran*1.15);
        r = mix(pal[0][0], pal[2][0], t); g = mix(pal[0][1], pal[2][1], t); b = mix(pal[0][2], pal[2][2], t);
        r = Math.min(255, r*1.05); g = Math.min(255, g*0.95);
      } else {
        // 岩质/岩石卫星：斑驳地表 + 明暗
        const n = fbm(nx*3.2, nz*3.2 + v*3.2, seed, 5);
        const fine = fbm(nx*14, nz*14 + v*14, seed+11, 3);
        let t = clamp01(n*0.85 + fine*0.25);
        if (kind === 'mars'){
          const dark = clamp01((fbm(nx*2.1, nz*2.1 + v*2.1, seed+31, 4) - 0.5)*2.4);
          t = clamp01(t*0.75 + 0.15);
          r = mix(190, 96, dark); g = mix(88, 44, dark); b = mix(56, 30, dark);
          if (Math.abs(lat) > 1.32){ const k = clamp01((Math.abs(lat)-1.32)/0.18); r = mix(r,238,k); g = mix(g,240,k); b = mix(b,245,k); }
        } else if (kind === 'venus'){
          const sw = fbm(nx*2.4, nz*2.4 + v*9, seed+5, 4);
          t = clamp01(0.45 + sw*0.6);
          r = mix(pal[0][0], pal[2][0], t); g = mix(pal[0][1], pal[2][1], t); b = mix(pal[0][2], pal[2][2], t);
        } else {
          if (t < 0.5){ const k = t/0.5; r = mix(pal[0][0],pal[1][0],k); g = mix(pal[0][1],pal[1][1],k); b = mix(pal[0][2],pal[1][2],k); }
          else { const k = (t-0.5)/0.5; r = mix(pal[1][0],pal[2][0],k); g = mix(pal[1][1],pal[2][1],k); b = mix(pal[1][2],pal[2][2],k); }
        }
      }
      const i = (y*W + x) * 4;
      d[i] = r; d[i+1] = g; d[i+2] = b; d[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  // 环形山 / 大红斑 / 极冠等特征
  const craters = kid => {
    const list = { mercury: 90, moon: 130, mars: 45 }[kid] || 0;
    for (let i=0;i<list;i++){
      const cx = Math.random()*W, cy = H*0.1 + Math.random()*H*0.8, rr = 3 + Math.random()*22;
      const lit = Math.random() > 0.5;
      const grd = ctx.createRadialGradient(cx, cy, rr*0.2, cx, cy, rr);
      grd.addColorStop(0, lit ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.20)');
      grd.addColorStop(0.72, lit ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.10)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI*2); ctx.fill();
    }
  };
  craters(kind);
  if (kind === 'jupiter'){
    const cx = W*0.66, cy = H*0.63;
    const grd = ctx.createRadialGradient(cx, cy, 2, cx, cy, W*0.06);
    grd.addColorStop(0, 'rgba(196,86,52,0.95)');
    grd.addColorStop(0.55, 'rgba(178,96,64,0.65)');
    grd.addColorStop(1, 'rgba(200,150,110,0)');
    ctx.save(); ctx.translate(cx, cy); ctx.scale(1.9, 0.85); ctx.translate(-cx, -cy);
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(cx, cy, W*0.06, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
  if (kind === 'neptune'){
    const grd = ctx.createRadialGradient(W*0.3, H*0.42, 2, W*0.3, H*0.42, W*0.05);
    grd.addColorStop(0, 'rgba(20,32,90,0.75)'); grd.addColorStop(1, 'rgba(40,60,140,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(W*0.3, H*0.42, W*0.05, 0, Math.PI*2); ctx.fill();
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

// 云层（带 alpha 的柔和团块，可直接作为 alphaMap）
function cloudTexture(seed){
  const W = 1024, H = 512;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  for (let i=0;i<85;i++){
    const cx = Math.random()*W, cy = H*0.06 + Math.random()*H*0.88;
    const rx = 16 + Math.random()*62, ry = rx*(0.25+Math.random()*0.4);
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
    grd.addColorStop(0, 'rgba(255,255,255,'+(0.28+Math.random()*0.32)+')');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save(); ctx.translate(cx,cy); ctx.scale(1, ry/rx); ctx.translate(-cx,-cy);
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(cx, cy, rx, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

// 土星环（径向明暗条纹 + alpha）
function ringTexture(){
  const W = 1024, H = 8;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  for (let x=0;x<W;x++){
    const t = x/W;
    let a = 0.15 + 0.75*Math.pow(Math.sin(t*Math.PI), 0.6);
    const gap = Math.exp(-Math.pow((t-0.62)/0.035,2))*0.85 + Math.exp(-Math.pow((t-0.28)/0.02,2))*0.4;
    a = clamp01(a - gap);
    const shade = 0.72 + 0.28*Math.sin(t*90) * 0.35 + 0.15*Math.sin(t*210);
    const r = 232*shade, g = 214*shade, b = 178*shade;
    const grd = ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0, 'rgba('+r+','+g+','+b+','+a+')');
    grd.addColorStop(1, 'rgba('+r+','+g+','+b+','+a+')');
    ctx.fillStyle = grd; ctx.fillRect(x,0,1,H);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// 网络贴图可选升级：成功则替换，失败保持程序化纹理
function upgradeTexture(url, apply){
  if (!url) return;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const t = new THREE.Texture(img);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = THREE.RepeatWrapping;
      t.anisotropy = 4;
      t.needsUpdate = true;
      apply(t);
    } catch(e){}
  };
  img.onerror = () => {};
  img.src = url;
}

/* ================= 地球（昼夜shader + 云层 + 大气）================= */
function makeEarth(group, R){
  earthUniforms = {
    dayMap:   { value: surfaceTexture('earthDay', 11) },
    nightMap: { value: surfaceTexture('earthNight', 11) },
    sunDir:   { value: new THREE.Vector3(1,0,0) }
  };
  upgradeTexture(T.earthDay,  t => { earthUniforms.dayMap.value = t; });
  upgradeTexture(T.earthNight, t => { earthUniforms.nightMap.value = t; });
  const mat = new THREE.ShaderMaterial({
    uniforms: earthUniforms,
    vertexShader: `
      #include <common>
      #include <logdepthbuf_pars_vertex>
      varying vec2 vUv; varying vec3 vN; varying vec3 vWp;
      void main(){
        vUv = uv;
        vN = normalize(mat3(modelMatrix) * normal);
        vec4 wp = modelMatrix * vec4(position,1.0);
        vWp = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
        #include <logdepthbuf_vertex>
      }`,
      fragmentShader: `
      #include <common>
      #include <logdepthbuf_pars_fragment>
      uniform sampler2D dayMap; uniform sampler2D nightMap; uniform vec3 sunDir;
      varying vec2 vUv; varying vec3 vN; varying vec3 vWp;
      void main(){
        #include <logdepthbuf_fragment>
        vec3 n = normalize(vN);
        float d = dot(n, normalize(sunDir));
        float t = smoothstep(-0.12, 0.28, d);
        vec3 day = texture2D(dayMap, vUv).rgb;
        vec3 night = texture2D(nightMap, vUv).rgb * 1.8;
        vec3 col = mix(night, day * (0.25 + 0.85*max(d,0.0)), t);
        vec3 vd = normalize(cameraPosition - vWp);
        float fres = pow(1.0 - max(dot(vd, n), 0.0), 2.6);
        col += vec3(0.25,0.5,1.0) * fres * (0.35 + 0.65*t);
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(R, 64, 64), mat);
  group.add(mesh);

  const cloudTex = cloudTexture(5);
  const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(R*1.012, 48, 48),
    new THREE.MeshLambertMaterial({
      map: cloudTex, alphaMap: cloudTex,
      transparent:true, opacity:0.7, depthWrite:false
    })
  );
  group.add(clouds);

  const atmo = new THREE.Mesh(
    new THREE.SphereGeometry(R*1.06, 48, 48),
    new THREE.ShaderMaterial({
      uniforms:{ sunDir: earthUniforms.sunDir },
      vertexShader:`
        #include <common>
        #include <logdepthbuf_pars_vertex>
        varying vec3 vN; varying vec3 vWp;
        void main(){
          vN = normalize(mat3(modelMatrix)*normal);
          vec4 wp = modelMatrix*vec4(position,1.0); vWp = wp.xyz;
          gl_Position = projectionMatrix*viewMatrix*wp;
          #include <logdepthbuf_vertex>
        }`,
      fragmentShader:`
        #include <common>
        #include <logdepthbuf_pars_fragment>
        uniform vec3 sunDir; varying vec3 vN; varying vec3 vWp;
        void main(){
          #include <logdepthbuf_fragment>
          vec3 vd = normalize(cameraPosition - vWp);
          float f = pow(1.0 - abs(dot(vd, normalize(vN))), 3.5);
          float lit = 0.4 + 0.6*max(dot(normalize(vN), normalize(sunDir)), 0.0);
          gl_FragColor = vec4(vec3(0.35,0.6,1.0)*f*lit*1.4, f*lit);
        }`,
      blending: THREE.AdditiveBlending, side: THREE.BackSide, transparent:true, depthWrite:false
    })
  );
  group.add(atmo);
  return mesh;
}

/* ================= 飞行镜头 ================= */
const easeInOut = t => t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

function bodyWorldPos(b, out){ return b.group.getWorldPosition(out).add(b.mesh ? b.mesh.position.clone().multiplyScalar(0) : new THREE.Vector3()); }
function getBodyPos(b, out){
  if (b === moonBody) return moonMesh.getWorldPosition(out);
  return b.group.getWorldPosition(out);
}
function flyTo(b, dist){
  const endTgt = getBodyPos(b, new THREE.Vector3());
  flight = {
    t: 0,
    dur: Math.min(7, 1.6 + camera.position.distanceTo(endTgt)/90),
    startPos: camera.position.clone(),
    startTgt: controls.target.clone(),
    body: b, dist
  };
  tracked = b;
  selectBody(b);
}
function flyToFree(pos, tgt){
  flight = {
    t:0, dur: Math.min(7, 1.6 + camera.position.distanceTo(pos)/90),
    startPos: camera.position.clone(), startTgt: controls.target.clone(),
    body:null, fixedPos: pos.clone(), fixedTgt: tgt.clone()
  };
  tracked = null;
}
function updateFlight(dt){
  if (!flight) return;
  flight.t += dt;
  const k = easeInOut(Math.min(1, flight.t/flight.dur));
  let endPos, endTgt;
  if (flight.body){
    endTgt = getBodyPos(flight.body, _v1);
    _v2.copy(camera.position).sub(endTgt);
    if (_v2.lengthSq() < 1e-6) _v2.set(0,0.3,1);
    _v2.normalize();
    endPos = _v3.copy(endTgt).add(_v2.multiplyScalar(flight.dist));
    endPos.y += flight.dist*0.35;
  } else {
    endPos = flight.fixedPos; endTgt = flight.fixedTgt;
  }
  camera.position.lerpVectors(flight.startPos, endPos, k);
  controls.target.lerpVectors(flight.startTgt, endTgt, k);
  if (flight.t >= flight.dur) flight = null;
}

let downX=0, downY=0;

canvas.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX-downX, e.clientY-downY) > 6) return;
  ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr, camera);
  const meshes = bodies.map(b => b.mesh).filter(Boolean);

    if (b) flyTo(b, Math.max(b.r*5, b.r+3));

function zoom(f){
  const off = _v1.copy(camera.position).sub(controls.target);
  const minD = tracked ? tracked.r*2.2 : 0.5;
  const len = Math.max(minD, off.length()*f);
  off.setLength(len);
  camera.position.copy(controls.target).add(off);
  flight = null;
}

/* ================= 主循环 ================= */
selectBody(earthBody);
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  try {
    const dt = Math.min(clock.getDelta(), 0.1);
    const step = paused ? 0 : dt * timeScale;

  // 公转 & 自转
  bodies.forEach(b => {
    if (b.isSun) { b.mesh.rotation.y += step*0.02; return; }
    if (b.cn === '月球'){ return; }
    if (b.orbitR){
      b.angle += b.speed * step;
      b.group.position.set(Math.cos(b.angle)*b.orbitR, 0, Math.sin(b.angle)*b.orbitR);
    }
    if (b.cn !== '地球') b.mesh.rotation.y += b.spin * step;
  });
  // 地球组位置由公转逻辑驱动（地球在 bodies 中 spin 特殊处理）
  earthBody.mesh.rotation.y += 0.1 * step;
  moonGroup.rotation.y += 0.9 * step;

  // 银河随相机距离淡入淡出：身处太阳系时隐去，避免光晕糊住画面
  const gVis = THREE.MathUtils.smoothstep(camera.position.length(), 550, 1600);
  const gCore = window.__galaxyCore, gPts = window.__galaxyPts;
  if (gCore){ gCore.material.opacity = 0.95 * gVis; }
  if (gPts){ gPts.material.opacity = 0.8 * gVis; }
  galaxy.visible = gVis > 0.02;
  moonMesh.rotation.y = -moonGroup.rotation.y; // 潮汐锁定
  galaxy.rotation.y += 0.004 * step;

  // 太阳方向（地球昼夜）
  if (earthUniforms){
    getBodyPos(earthBody, _v1);
    earthUniforms.sunDir.value.copy(_v1).multiplyScalar(-1).normalize();
  }

  // 追踪：相机跟随天体
  if (tracked && !flight){
    const cur = getBodyPos(tracked, _v1).clone();
    const prev = prevBodyPos.get(tracked.cn);
    if (prev){
      _v2.copy(cur).sub(prev);
      camera.position.add(_v2);
      controls.target.add(_v2);
    }
    prevBodyPos.set(tracked.cn, cur);
    controls.minDistance = Math.max(tracked.r*1.7, 0.4);
  } else if (flight && flight.body){
    prevBodyPos.set(flight.body.cn, getBodyPos(flight.body, _v1).clone());
    controls.minDistance = Math.max(flight.body.r*1.7, 0.4);
  } else {
    controls.minDistance = 0.5;
  }

  if (!paused) updateFlight(dt);

  controls.update();

  // 防止相机穿入任何天体
  bodies.forEach(b => {
    getBodyPos(b, _v1);
    const min = b.r*1.35;
    const d = camera.position.distanceTo(_v1);
    if (d < min){
      _v2.copy(camera.position).sub(_v1).setLength(min);
      camera.position.copy(_v1).add(_v2);
    }
  });

  renderer.render(scene, camera);
  } catch (err) {
    window.__diag('[渲染错误] ' + (err && err.message ? err.message : String(err)));
    console.error(err);
  }
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* 初始：飞往近地轨道 */
flyTo(earthBody, 9);
</script>
</body>
</html>
