<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个网页</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: #f6f7f9;
      color: #23272f;
      line-height: 1.8;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .sub { color: #6b7280; font-size: 14px; margin: 0 0 24px; }
    h2 { font-size: 15px; margin: 26px 0 10px; color: #185fa5; }
    ul { padding-left: 20px; margin: 0; }
    li { margin: 6px 0; font-size: 15px; }
    .tag {
      display: inline-block;
      background: #e6f1fb;
      color: #185fa5;
      border-radius: 6px;
      padding: 1px 10px;
      font-size: 12px;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>我的第一个网页</h1>
    <p class="sub">写于 2026 年 10 月 · 我的第一个 GitHub 仓库</p>

    <p>
      这个页面没什么技术含量,但它证明了一件事:
      我能写代码,也能让别的地方的人看到它。
    </p>

    <h2>我正在学的</h2>
    <ul>
      <li><span class="tag">编程</span>Python 基础、HTML 与 CSS</li>
      <li><span class="tag">数学</span>高等数学</li>
      <li><span class="tag">方向</span>AI 到底怎么用在护理和临床里</li>
    </ul>

    <h2>下一步想做的</h2>
    <ul>
      <li>把护理课本里的数据做成一个能点、能查的小工具</li>
      <li>学会用 Git 管住自己的每一次改动,不再靠"新建副本2"</li>
    </ul>
  </div>
</body>
</html>
