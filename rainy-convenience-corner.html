<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {OutlineEffect} from 'three/addons/effects/OutlineEffect.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ---------- 基础 ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c14);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 120);
camera.position.set(10.5, 7.5, 12.5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
const stopAuto = ()=>{ controls.autoRotate = false; };
renderer.domElement.addEventListener('pointerdown', stopAuto);
renderer.domElement.addEventListener('wheel', stopAuto, {passive:true});

/* ---------- 三渲二：toon 材质 + 描边 ---------- */
const grad = (()=>{
  const c = document.createElement('canvas'); c.width = 4; c.height = 1;
  const g = c.getContext('2d');
  ['#3d4450','#8a919e','#d4d8de','#ffffff'].forEach((col,i)=>{ g.fillStyle = col; g.fillRect(i,0,1,1); });
  const t = new THREE.CanvasTexture(c);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  return t;
})();
const M = (color, opt={}) => new THREE.MeshToonMaterial({color, gradientMap:grad, ...opt});
const B = (color, opt={}) => new THREE.MeshBasicMaterial({color, toneMapped:false, ...opt});

function ctex(w, h, fn){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* 发光光晕精灵（霓虹感的廉价关键） */
function glow(rgb, scale, pos, opacity){
  const t = ctex(128,128,(g)=>{
    const r = g.createRadialGradient(64,64,0,64,64,64);
    r.addColorStop(0, `rgba(${rgb},0.9)`);
    r.addColorStop(0.4, `rgba(${rgb},0.35)`);
    r.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = r; g.fillRect(0,0,128,128);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map:t, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false
  }));
  s.scale.setScalar(scale); s.position.copy(pos); scene.add(s);
  return s;
}

/* ---------- 灯光 ---------- */
scene.add(new THREE.HemisphereLight(0x33415e, 0x141720, 0.85));
const moon = new THREE.DirectionalLight(0x8fa3cc, 0.55);
moon.position.set(-8, 14, 6);
moon.castShadow = true;
moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.left = -9; moon.shadow.camera.right = 9;
moon.shadow.camera.top = 9; moon.shadow.camera.bottom = -9;
scene.add(moon);

const warmShop = new THREE.PointLight(0xffb066, 22, 10, 2);   // 店门口暖光
warmShop.position.set(-1.2, 2.2, -2.2); scene.add(warmShop);
const vendLight = new THREE.PointLight(0xff5f6e, 5, 4, 2);    // 贩卖机红光
vendLight.position.set(1.4, 1.4, -2.0); scene.add(vendLight);
const lampLight = new THREE.SpotLight(0xcfe0ff, 60, 9, 0.62, 0.5, 2); // 路灯
lampLight.position.set(-4.9, 4.4, -1.5);
lampLight.target.position.set(-4.9, 0, -0.4); scene.add(lampLight, lampLight.target);
const neonA = new THREE.PointLight(0xff6fae, 8, 8, 2);        // 招牌粉光
neonA.position.set(-2, 3.1, -1.6); scene.add(neonA);
const alleyBulb = new THREE.PointLight(0xffc37a, 4, 4, 2);    // 小巷灯泡
alleyBulb.position.set(1.65, 2.3, -3.1); scene.add(alleyBulb);

/* ---------- 底座 ---------- */
const BASE = 11;                       // 正方形底座边长
{
  const base = new THREE.Mesh(new THREE.BoxGeometry(BASE, 0.8, BASE), M(0x3a404c));
  base.position.y = -0.4; base.receiveShadow = true; scene.add(base);
  const rim = new THREE.Mesh(new THREE.BoxGeometry(BASE+0.18, 0.16, BASE+0.18), M(0x2a2f3a));
  rim.position.y = -0.72; scene.add(rim);
}
/* 沥青路面（带一点湿地反光） */
const roadMat = new THREE.MeshStandardMaterial({color:0x242832, roughness:0.5, metalness:0.3, envMapIntensity:0.6});
const road = new THREE.Mesh(new THREE.BoxGeometry(BASE, 0.02, BASE), roadMat);
road.position.y = 0.012; road.receiveShadow = true; scene.add(road);

function slab(w,d,x,z,color,h=0.1){
  const s = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), M(color));
  s.position.set(x, h/2+0.02, z); s.receiveShadow = true; s.castShadow = false;
  scene.add(s); return s;
}
/* 人行道：店前 + 转角 + 对侧窄条 */
slab(11, 2.2, 0, -1.8, 0x767c88);
slab(1.6, 2.2, 3.1, -1.8, 0x767c88);
slab(11, 0.8, 0, 3.1, 0x6d727e);

/* ---------- 便利店主体 ---------- */
const store = new THREE.Group(); scene.add(store);
{

  body.position.set(-2, 1.55, -4.2); body.castShadow = body.receiveShadow = true; store.add(body);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(6.3, 0.18, 2.9), M(0x3c4250));
  roof.position.set(-2, 3.19, -4.2); roof.castShadow = true; store.add(roof);

/* 招牌 */
const signTex = ctex(768,192,(g)=>{

  g.fillText('コンビニ', 250, 86);
  g.font = 'bold 58px "Yu Gothic","Meiryo",sans-serif';
  g.fillStyle = '#7ff0e0'; g.shadowColor = '#7ff0e0'; g.shadowBlur = 18;
  g.fillText('MART 24', 580, 74);
  g.font = '34px "Yu Gothic","Meiryo",sans-serif';
  g.fillStyle = '#9fd0ff'; g.shadowBlur = 8; g.shadowColor = '#9fd0ff';
  g.fillText('— 24時間営業中 —', 580, 146);
});
const sign = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 0.72), B(0xffffff, {map:signTex}));
sign.position.set(-2, 2.78, -2.885); store.add(sign);
glow('255,111,174', 6.5, new THREE.Vector3(-2, 2.8, -2.4), 0.32);

/* 橱窗（暖色店内剪影） */
const windowTex = ctex(256,256,(g)=>{
  const gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#fff0d2'); gr.addColorStop(1,'#eda75c');
  g.fillStyle = gr; g.fillRect(0,0,256,256);
  g.fillStyle = '#7c5a34';
  for(let i=0;i<3;i++){ g.fillRect(16, 60+i*62, 224, 8); }          // 货架
  const cols = ['#e35d5d','#5db8e3','#e3c75d','#7de35d','#c95de3','#f09a4a'];
  for(let r=0;r<3;r++) for(let i=0;i<9;i++){
    g.fillStyle = cols[(r*3+i)%6];
    g.fillRect(24+i*24, 40+r*62, 14, 20);                            // 商品
  }
  g.fillStyle = '#8a6a3e'; g.fillRect(0,220,256,36);                 // 吧台
});
function shopWindow(x, w){
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, 1.7), B(0xffffff, {map:windowTex}));
  p.position.set(x, 1.35, -3.42); store.add(p);

  frame.position.set(x, 1.35, -3.44); store.add(frame);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(w, 1.7),
    new THREE.MeshBasicMaterial({color:0xbfe0ea, transparent:true, opacity:0.16}));
  glass.position.set(x, 1.35, -2.95); store.add(glass);
}
shopWindow(-3.45, 2.3);
shopWindow(-0.35, 1.5);

/* 自动门 */
{
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.3, 0.14), M(0x39404e));
  frame.position.set(-1.25, 1.15, -2.93); store.add(frame);
  const glassMat = new THREE.MeshBasicMaterial({color:0xaacdde, transparent:true, opacity:0.28});
  const L = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 2.0), glassMat);
  L.position.set(-1.49, 1.08, -2.86); store.add(L);
  const R = L.clone(); R.position.x = -1.01; store.add(R);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.07, 0.1), M(0x8f97a6));
  bar.position.set(-1.25, 1.05, -2.84); store.add(bar);
  const sticker = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.2), B(0xff5f8a));
  sticker.position.set(-1.25, 1.55, -2.85); store.add(sticker);
}
/* 屋檐雨棚（红白条） */
const awningTex = ctex(512,128,(g)=>{
  for(let i=0;i<8;i++){ g.fillStyle = i%2 ? '#f2f0ea' : '#d8404e'; g.fillRect(i*64,0,64,128); }
});
{
  const aw = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.08, 0.85),
    new THREE.MeshToonMaterial({map:awningTex, gradientMap:grad}));
  aw.position.set(-2, 2.32, -2.55); aw.rotation.x = 0.22; aw.castShadow = true; store.add(aw);
  const strip = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.05, 0.1), B(0xfff2cf));
  strip.position.set(-2, 2.26, -2.2); store.add(strip);
}
/* 门口地垫 */
{
  const mat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.03, 0.6), M(0x2e4a3a));
  mat.position.set(-1.25, 0.12, -2.5); mat.receiveShadow = true; store.add(mat);
}
/* 店侧墙面告示 */
{
  const p = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.8), B(0xf5efdf, {map:ctex(128,96,(g)=>{
    g.fillStyle='#f5efdf'; g.fillRect(0,0,128,96);
    g.fillStyle='#d8404e'; g.fillRect(10,10,108,26);
    g.fillStyle='#4a5568'; for(let i=0;i<3;i++) g.fillRect(14,46+i*14,100-i*22,7);
  })}));
  p.position.set(-4.98, 1.6, -3.5); p.rotation.y = -Math.PI/2; store.add(p);
}
/* 屋顶空调外机 */
function makeAC(scale=1){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.62, 0.34), M(0xb9bec7));
  g.add(body);
  const grill = new THREE.Mesh(new THREE.PlaneGeometry(0.66, 0.5), B(0x2a2e38, {map:ctex(64,64,(x)=>{
    x.fillStyle='#2a2e38'; x.fillRect(0,0,64,64); x.fillStyle='#454b58';
    for(let i=0;i<8;i++) x.fillRect(4, 4+i*8, 56, 3);
  })}));
  grill.position.z = 0.175; g.add(grill);
  g.scale.setScalar(scale);
  g.traverse(o=>{ if(o.isMesh){ o.castShadow = true; } });
  return g;
}
const acUnit = makeAC();
acUnit.position.set(-3.6, 3.5, -4.2); store.add(acUnit);

/* ---------- 右侧小楼（巷子旁的建筑立面） ---------- */
const house = new THREE.Group(); scene.add(house);
{
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.4, 2.6), M(0x5b5348));
  body.position.set(3.9, 1.2, -4.2); body.castShadow = body.receiveShadow = true; house.add(body);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.16, 2.9), M(0x33383f));
  roof.position.set(3.9, 2.48, -4.2); roof.castShadow = true; house.add(roof);
  const win = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9), B(0xffe1a8, {map:ctex(64,64,(g)=>{
    g.fillStyle='#ffdf9e'; g.fillRect(0,0,64,64);
    g.fillStyle='#7c5a34'; g.fillRect(29,0,6,64); g.fillRect(0,29,64,6);
  })}));
  win.position.set(4.6, 1.5, -2.885); house.add(win);
  glow('255,214,150', 2.2, new THREE.Vector3(4.6, 1.5, -2.6), 0.2);
  const ac2 = makeAC(0.9); ac2.position.set(3.2, 0.62, -2.85); house.add(ac2);
}
/* 海报栏 */
{
  const boardTex = ctex(256,192,(g)=>{
    g.fillStyle = '#3a404c'; g.fillRect(0,0,256,192);
    const post = (x,c1,c2)=>{
      g.fillStyle = c1; g.fillRect(x,14,72,164);
      g.fillStyle = c2; g.fillRect(x+8,24,56,30);
      g.fillStyle = 'rgba(255,255,255,0.75)';
      for(let i=0;i<5;i++) g.fillRect(x+8, 64+i*20, 56-(i%3)*14, 6);
    };
    post(10,'#e9e4d8','#d8404e'); post(92,'#dfe8ec','#3f7fbf'); post(174,'#efe0d0','#5d9e5d');
  });
  const board = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.0, 0.12), B(0xffffff, {map:boardTex}));
  board.position.set(2.65, 1.15, -2.82); board.rotation.y = 0.12;
  board.castShadow = true; scene.add(board);
  const leg = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.66, 0.1), M(0x2c313c));
  leg.position.set(2.65, 0.32, -2.86); scene.add(leg);
}

/* ---------- 小巷 ---------- */
{
  const wallLamp = new THREE.Mesh(new THREE.SphereGeometry(0.07,10,10), B(0xffd9a0));
  wallLamp.position.set(1.65, 2.35, -3.0); scene.add(wallLamp);
  glow('255,190,120', 1.4, wallLamp.position, 0.3);
  const ac3 = makeAC(1.0); ac3.position.set(1.9, 0.33, -4.6); ac3.rotation.y = Math.PI/2; scene.add(ac3);
  const crate = (x,z,c)=>{ const b = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.42,0.42), M(c));
    b.position.set(x,0.23,z); b.rotation.y = 0.3; b.castShadow = true; scene.add(b); return b; };
  crate(1.25,-4.3,0x6e5a3c); crate(1.7,-4.15,0x5a4a30); crate(1.45,-4.25,0x7a6644).position.y = 0.65;
}

/* ---------- 自动贩卖机 ---------- */
const vendTex = ctex(256,384,(g)=>{
  g.fillStyle = '#eef1f4'; g.fillRect(0,0,256,384);
  g.fillStyle = '#e23b4e'; g.fillRect(0,0,256,64);
  g.font = 'bold 30px "Yu Gothic","Meiryo",sans-serif'; g.fillStyle = '#fff';
  g.textAlign = 'center'; g.fillText('つめた〜い', 128, 44);
  const cols = ['#e35d5d','#5db8e3','#e3c75d','#7de35d','#f09a4a','#c95de3'];
  [22,140].forEach((x,ci)=>{
    g.fillStyle = '#b8d8e0'; g.fillRect(x, 76, 94, 210);
    for(let r=0;r<4;r++) for(let i=0;i<2;i++){
      g.fillStyle = cols[(ci*2+r+i)%6];
      g.beginPath(); g.arc(x+28+i*40, 104+r*50, 13, 0, 7); g.fill();
    }
  });
  g.fillStyle = '#3a6fbf'; g.fillRect(22, 296, 212, 30);
  g.fillStyle = '#fff'; g.font = 'bold 22px sans-serif'; g.fillText('ドリンク 24', 128, 318);
  g.fillStyle = '#2c3038'; g.fillRect(0, 336, 256, 48);
});
{

  body.position.y = 0.92; body.castShadow = true; v.add(body);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 1.7), B(0xffffff, {map:vendTex}));

}

/* ---------- 垃圾桶 / 伞架 ---------- */
{
  const can = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.22, 0.72, 14), M(0x3e5e46));
  can.position.set(0.72, 0.46, -2.4); can.castShadow = true; scene.add(can);

/* ---------- 自行车 ---------- */
function bicycle(frameColor){
  const g = new THREE.Group();
  const wheel = (x)=>{
    const t = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.032, 8, 22), M(0x23262e));
    t.position.set(x, 0.3, 0); t.rotation.y = Math.PI/2; g.add(t);
  };
  wheel(-0.42); wheel(0.42);
  const bar = (w,h,d,x,y,z,rz=0)=>{
    const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), M(frameColor));
    b.position.set(x,y,z); b.rotation.z = rz; b.castShadow = true; g.add(b); return b;
  };
  bar(0.72,0.05,0.05, 0,0.52,0, -0.12);
  bar(0.05,0.4,0.05, -0.34,0.42,0, 0.5);
  bar(0.05,0.5,0.05, 0.34,0.46,0, -0.35);
  bar(0.05,0.05,0.42, 0.42,0.72,0);
  bar(0.3,0.05,0.08, -0.4,0.62,0);
  const basket = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.2,0.24), M(0x4a4f5a));
  basket.position.set(0.42,0.58,0); g.add(basket);
  return g;
}

{

  const mk = (w,d,x,z,ry=0)=>{

  const b1 = bicycle(0x3f8fbf); b1.position.set(2.85, 0.1, -2.0); b1.rotation.y = Math.PI/2 + 0.08; scene.add(b1);
  const b2 = bicycle(0xd8404e); b2.position.set(3.38, 0.1, -2.05); b2.rotation.y = Math.PI/2 - 0.1; scene.add(b2);

/* ---------- 路灯 ---------- */
{
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,4.4,10), M(0x2f3541));

  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.016, 5), M(0x171a21));
  scene.add(m);
}

/* ---------- 积水（镜面感 + 霓虹倒影光斑） ---------- */
function puddle(x, z, sx, sz, tint, y=0.045){
  const p = new THREE.Mesh(new THREE.CircleGeometry(1, 28),
    new THREE.MeshStandardMaterial({color:0x11141c, roughness:0.06, metalness:0.95, envMapIntensity:1.3}));
  p.rotation.x = -Math.PI/2; p.scale.set(sx, sz, 1);

  if(tint) glow(tint, Math.max(sx,sz)*2.2, new THREE.Vector3(x, y+0.05, z), 0.16);
}

/* ---------- 雨 ---------- */
const RAIN_N = 650;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(RAIN_N * 6);
const drops = [];
for(let i=0;i<RAIN_N;i++){
  drops.push({x:(Math.random()-0.5)*11, y:Math.random()*9, z:(Math.random()-0.5)*11,
              s:9+Math.random()*7, l:0.28+Math.random()*0.22});
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo,
  new THREE.LineBasicMaterial({color:0x9fb4d8, transparent:true, opacity:0.34, blending:THREE.AdditiveBlending}));
scene.add(rain);
function updateRain(dt){
  const H = 9;
  for(let i=0;i<RAIN_N;i++){
    const d = drops[i];
    d.y -= d.s * dt;
    if(d.y < 0){ d.y = H + Math.random()*1.5; d.x = (Math.random()-0.5)*11; d.z = (Math.random()-0.5)*11; }
    const o = i*6;
    rainPos[o]=d.x;   rainPos[o+1]=d.y;      rainPos[o+2]=d.z;
    rainPos[o+3]=d.x; rainPos[o+4]=d.y+d.l;  rainPos[o+5]=d.z;
  }
  rainGeo.attributes.position.needsUpdate = true;
}

/* ---------- 描边渲染 ---------- */
const effect = new OutlineEffect(renderer, {defaultThickness:0.0026, defaultColor:[0.05,0.06,0.09]});

/* ---------- 主循环 ---------- */
const clock = new THREE.Clock();
let flickT = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateRain(dt);
  flickT += dt;
  const flick = 0.9 + Math.sin(flickT*17)*0.06 + Math.sin(flickT*5.3)*0.04;   // 霓虹轻微闪烁
  neonA.intensity = 8 * flick;
  vendLight.intensity = 5 * (0.94 + Math.sin(flickT*11)*0.06);
  controls.update();
  effect.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
